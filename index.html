<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#5797d4"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>乙級術科｜每日練習</title><style>
:root{--bg:#f0f7ff;--ink:#24496f;--muted:#738daa;--blue:#4389c6;--light:#e0efff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#e4f1ff,#f8fbff 45%);font:15px/1.65 system-ui,'Noto Sans TC',sans-serif;color:var(--ink)}main{max-width:610px;margin:auto;padding:22px 17px 90px}h1{font-size:24px;margin:6px 0}h2{font-size:19px;margin:0 0 12px}p{margin:8px 0}.muted{color:var(--muted);font-size:13px}.card{background:white;border:1px solid #d6e7f9;border-radius:20px;padding:20px;margin:15px 0;box-shadow:0 7px 24px #2050870b}.hero{background:linear-gradient(130deg,#d5eaff,#f6fbff)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}button{border:0;border-radius:13px;padding:13px 15px;background:var(--blue);color:white;font:600 15px system-ui;cursor:pointer}button.soft{background:var(--light);color:#32699d}button.outline{background:white;border:1px solid #bbd7ed;color:#32699d}button:disabled{opacity:.5}button.full{width:100%}textarea,input,select{width:100%;background:#fafdff;border:1px solid #c6ddef;border-radius:12px;padding:11px;font:inherit;color:var(--ink)}textarea{min-height:110px;resize:vertical}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}nav{display:flex;gap:5px;margin:14px 0}nav button{background:#d9e9f9;color:#527da4;padding:10px 4px;font-size:13px}nav button.on{background:#5694cd;color:white}.stat{flex:1;background:#f1f7ff;border-radius:13px;padding:12px;text-align:center;min-width:90px}.stat strong{display:block;font-size:24px}.pill{display:inline-block;border-radius:100px;padding:4px 11px;background:#e0efff;color:#3572ab;font-size:12px}.progress{height:10px;background:#dfebf7;overflow:hidden;border-radius:50px}.progress>div{height:100%;background:#5b9ed6;transition:width .2s}.hidden{display:none!important}.answer{background:#eaf5ff;padding:13px;border-radius:13px;white-space:pre-line}.correct{color:#267a62}.wrong{color:#a75f35}hr{border:0;border-top:1px solid #e4eff9;margin:16px 0}.item{border-bottom:1px solid #e6eff8;padding:9px 0}.small{font-size:12px}.warning{background:#fff8e6;border-radius:12px;padding:12px;font-size:13px;color:#886533}details{margin-top:12px}summary{cursor:pointer;font-weight:600}a{color:#276fb0}#toast{position:fixed;left:12px;right:12px;bottom:18px;max-width:530px;margin:auto;background:#275c8e;color:white;padding:13px;border-radius:15px;display:none;z-index:4}#toast button{background:#eaf5ff;color:#275c8e;margin-top:8px;width:100%}
</style></head><body><main><header><span class="pill">12600｜術科專用</span><h1>每天一點，練到會</h1><p class="muted">你的室內裝修工程管理乙級術科複習空間</p></header><nav id="nav"><button data-page="home" class="on">今日</button><button data-page="wrong">錯題</button><button data-page="progress">熟練度</button><button data-page="mock">模擬考</button><button data-page="settings">設定</button></nav><section id="home"></section><section id="wrong" class="hidden"></section><section id="progress" class="hidden"></section><section id="mock" class="hidden"></section><section id="settings" class="hidden"></section></main><div id="toast"></div><script>
const $=x=>document.getElementById(x),STORE='interior-skill-study-v1';const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});const week=()=>{const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'})};const rand=(n)=>Math.floor(Math.random()*n);
let Q=[],page='home',active=null,mock=null;let db;try{db=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){db={}};db={history:[],schedule:{},skipWeeks:{},mocks:[],settings:{start:9,end:21,notify:true},...db};const save=()=>localStorage.setItem(STORE,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const find=id=>Q.find(q=>q.id===id);const allHist=id=>db.history.filter(x=>x.id===id);function skill(id){let a=allHist(id);if(!a.length)return 0;const recent=a.slice(-4);return Math.round((recent.reduce((n,r)=>n+(r.grade===2?1:r.grade===1?.55:0),0)/recent.length)*100)}function accuracy(rows){return rows.length?Math.round(rows.filter(r=>r.grade===2).length/rows.length*100):0}function trained(){return [...new Set(db.history.map(x=>x.id))].length}function goal(){const a=db.history.slice(-50);const categories=[...new Set(Q.map(q=>q.category))];const covered=categories.every(c=>db.history.some(r=>find(r.id)?.category===c));return {score:accuracy(a),ready:a.length>=50&&accuracy(a)>=85&&trained()>=20&&covered&&categories.every(c=>accuracy(db.history.filter(r=>find(r.id)?.category===c).slice(-10))>=65),covered}}function generate(day){if(db.schedule[day])return db.schedule[day];const date=new Date(day+'T12:00:00');if([0,6].includes(date.getDay()))return db.schedule[day]={slots:[],done:[]};const count=1+rand(2),a=db.settings.start,b=db.settings.end;let slots=[];for(let i=0;i<count;i++){let start=a+(b-a)*i/count,end=a+(b-a)*(i+1)/count;slots.push(Math.round((start+Math.random()*(end-start)) *60))}db.schedule[day]={slots:slots.sort((x,y)=>x-y),done:[]};save();return db.schedule[day]}
function changePage(p){page=p;document.querySelectorAll('section').forEach(s=>s.classList.toggle('hidden',s.id!==p));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===p));render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>changePage(b.dataset.page));function choose(){const pool=Q.filter(q=>allHist(q.id).length<2||skill(q.id)<80);return (pool.length?pool:Q)[rand((pool.length?pool:Q).length)]}
function startPractice(mode='daily'){active={mode,q:choose(),hint:false};changePage('home')}
function renderQ(q,idx,total){const el=$('home');el.innerHTML=`<div class="card"><span class="pill">${esc(q.category)} · ${idx}/${total}</span><h2 style="margin-top:15px">${esc(q.prompt)}</h2><button class="soft" onclick="showHint()">看提示（不直接公布答案）</button><div id="hint" class="muted" style="display:none;margin-top:10px">${esc(q.hint)}</div><label>先自己寫下答案或計算步驟</label><textarea id="draft" placeholder="用自己的話回答，不必一字不差"></textarea><button class="full" onclick="reveal()">完成作答，核對答案</button><div id="review" class="hidden"><hr><strong>參考作答要點</strong><div class="answer">${esc(q.answer)}</div><p class="muted">請比對關鍵概念，自行判斷；系統不會只靠文字相似度判分。</p><div class="row"><button class="soft" onclick="grade(0)">不會／答錯</button><button class="soft" onclick="grade(1)">部分正確</button><button onclick="grade(2)">完整答對</button></div></div></div>`}
window.showHint=()=>{$('hint').style.display='block';active.hint=true};window.reveal=()=>{$('review').classList.remove('hidden');active.draft=$('draft').value};window.grade=(g)=>{const row={id:active.q.id,grade:g,at:new Date().toISOString(),draft:active.draft||'',hint:active.hint,mode:active.mode};db.history.push(row);if(active.mode==='daily'){let d=generate(today());const due=d.slots.findIndex((t,i)=>!d.done.includes(i));if(due>=0)d.done.push(due)}save();active=null;render()};
function nextDue(){const d=generate(today());const now=new Date(),minute=now.getHours()*60+now.getMinutes();return d.slots.map((t,i)=>({t,i})).filter(x=>!d.done.includes(x.i)&&x.t<=minute)[0]}
function hm(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function renderHome(){if(active){renderQ(active.q,1,1);return}const d=generate(today()),du=nextDue(),isSkip=!!db.skipWeeks[week()];$('home').innerHTML=`<div class="card hero"><p class="muted">今天 · ${today()}</p><h2>${isSkip?'本週免練日已使用':du?'有一回練習可以開始':'按自己的節奏前進'}</h2><p>${d.done.length} / ${d.slots.length} 次已完成</p><div class="progress"><div style="width:${d.slots.length?d.done.length/d.slots.length*100:100}%"></div></div><p class="muted">${d.slots.length?`今日隨機練習時段：${d.slots.map(hm).join('、')}`:'週末不安排固定練習'}</p><button class="full" onclick="startPractice('daily')">${du?'開始今日練習':'現在練一題'}</button></div><div class="card"><h2>目前累積</h2><div class="row"><div class="stat"><strong>${db.history.length}</strong><span class="muted">作答次數</span></div><div class="stat"><strong>${trained()}</strong><span class="muted">不同題目</span></div><div class="stat"><strong>${accuracy(db.history.slice(-50))}%</strong><span class="muted">近 50 次完整答對</span></div></div><p class="muted">每次練習 1 題，若今天安排兩次，會分散在不同時段。</p></div>`}
function renderWrong(){let ids=[...new Set(db.history.map(x=>x.id))].filter(id=>skill(id)<80).sort((a,b)=>skill(a)-skill(b));$('wrong').innerHTML=`<div class="card"><h2>錯題與不熟練清單</h2><p class="muted">依最近四次表現計分，完整答對 100、部分正確 55、答錯 0。低於 80 分列入複習。</p>${ids.length?ids.map(id=>`<div class="item"><span class="pill">${esc(find(id)?.category)}</span> <b>${skill(id)} 分</b><p>${esc(find(id)?.prompt)}</p><button class="soft" onclick="reviewOne('${id}')">重練</button></div>`).join(''):'目前還沒有紀錄，先做幾題吧。'}</div>`};window.reviewOne=id=>{active={mode:'review',q:find(id),hint:false};changePage('home')};
function renderProgress(){const g=goal(),cats=[...new Set(Q.map(q=>q.category))];$('progress').innerHTML=`<div class="card"><h2>熟練度儀表板</h2><div class="row"><div class="stat"><strong>${g.score}%</strong><span class="muted">近 50 次完整答對率</span></div><div class="stat"><strong>${trained()}/${Q.length}</strong><span class="muted">已練題數</span></div></div><p><span class="pill">${g.ready?'達到預備模考門檻':'尚未達到模考建議門檻'}</span></p><p class="muted">建議門檻：至少 50 次作答、練過 20 種不同題、近 50 次完整答對率 ≥85%，且各類別近期完整答對率 ≥65%。僅供複習管理，非官方通過標準。</p>${cats.map(c=>{const rs=db.history.filter(r=>find(r.id)?.category===c);return `<div class="item"><div class="row"><b>${esc(c)}</b><span>${accuracy(rs.slice(-10))}% · ${rs.length} 次</span></div><div class="progress"><div style="width:${accuracy(rs.slice(-10))}%"></div></div></div>`}).join('')}</div><div class="card"><h2>模考評估</h2><p>${db.mocks.length} 場模考紀錄</p><p class="muted">達到學習門檻後，建議主動做 3～5 場完整模考。須使用足量、經校對且符合當年度規則的題庫，才具有較高評估價值。</p></div>`}
function renderMock(){const g=goal();$('mock').innerHTML=`<div class="card"><h2>術科模擬測驗</h2><p class="muted">目前是「術科自評練習模考」，非正式考試的整套製圖／問答評分。26 題原創題庫不足以可靠模擬 50 題且不重複的考試。</p><p class="pill">${g.ready?'已達基礎複習門檻':'目前建議先累積日常練習'}</p><label>測驗題數</label><select id="mockCount"><option value="20">20 題（入門診斷）</option><option value="25">25 題（完整初階診斷）</option><option value="50">50 題（會重複題目，不供通過評估）</option></select><button class="full" onclick="beginMock()">開始模擬測驗</button><hr><h2>歷次模考</h2>${db.mocks.length?db.mocks.slice().reverse().map(m=>`<div class="item">${esc(m.date)} · ${m.score}% · ${m.count} 題 ${m.count>Q.length?'（含重複題）':''}</div>`).join(''):'尚無紀錄'}</div>`};window.beginMock=()=>{const n=Number($('mockCount').value),ids=[];while(ids.length<n){let sorted=[...Q].sort(()=>Math.random()-.5);ids.push(...sorted.map(q=>q.id).slice(0,n-ids.length))}mock={ids,grades:[],pos:0};mockNext()};function mockNext(){if(mock.pos>=mock.ids.length){const score=Math.round(mock.grades.filter(g=>g===2).length/mock.grades.length*100);db.mocks.push({date:today(),score,count:mock.ids.length});save();alert(`本次模考完整答對率：${score}%\n這是自評練習成績，不是官方術科預測。`);mock=null;changePage('mock');return}active={mode:'mock',q:find(mock.ids[mock.pos]),hint:false};changePage('home');renderQ(active.q,mock.pos+1,mock.ids.length)}const normalGrade=window.grade;window.grade=g=>{if(active?.mode==='mock'){db.history.push({id:active.q.id,grade:g,at:new Date().toISOString(),draft:active.draft||'',mode:'mock',hint:active.hint});mock.grades.push(g);mock.pos++;save();active=null;mockNext()}else normalGrade(g)};
function renderSettings(){$('settings').innerHTML=`<div class="card"><h2>練習通知設定</h2><p>週一至週五，每日隨機 1 或 2 次，時段由下方設定。</p><div class="row"><div><label>開始小時</label><select id="from">${Array.from({length:14},(_,i)=>i+7).map(v=>`<option value="${v}" ${v===db.settings.start?'selected':''}>${v}:00</option>`).join('')}</select></div><div><label>結束小時</label><select id="to">${Array.from({length:14},(_,i)=>i+9).map(v=>`<option value="${v}" ${v===db.settings.end?'selected':''}>${v}:00</option>`).join('')}</select></div></div><button class="full" onclick="saveHours()">儲存時間設定</button><p class="muted">每日隨機時段只在當天第一次開啟時產生；若網頁未開啟，無法保證準時推播。網頁提醒不是系統鬧鐘。</p><button class="soft full" onclick="askNotify()">允許瀏覽器通知</button><hr><h2>每週一次免練</h2><p class="muted">已使用：${db.skipWeeks[week()]?'是':'否'}</p><button class="outline full" ${db.skipWeeks[week()]?'disabled':''} onclick="skipToday()">本週使用一次免練</button><hr><h2>備份與資料</h2><p class="muted">資料目前存在這台手機的瀏覽器內。換手機、清除網站資料，可能遺失紀錄；請定期匯出。</p><button class="soft" onclick="exportData()">匯出學習紀錄 JSON</button><label>還原紀錄</label><input type="file" id="restore" accept="application/json" onchange="importData(this)"><hr><h2>題庫資訊</h2><p>目前 ${Q.length} 題原創術科簡答／計算入門題。不是勞動部官方題庫，簡答由你根據參考要點自評。</p></div>`};window.saveHours=()=>{const a=Number($('from').value),b=Number($('to').value);if(a>=b)return alert('結束時間必須晚於開始時間');db.settings.start=a;db.settings.end=b;delete db.schedule[today()];save();render()};window.skipToday=()=>{if(db.skipWeeks[week()])return;db.skipWeeks[week()]=today();const d=generate(today());d.done=d.slots.map((_,i)=>i);save();render()};window.askNotify=async()=>{if(!('Notification'in window))return alert('此瀏覽器不支援通知');alert('通知功能需在 HTTPS 網站上操作。');try{await Notification.requestPermission()}catch(e){}};window.exportData=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='乙級術科學習紀錄-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)};window.importData=async x=>{const f=x.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.history)||!Array.isArray(d.mocks))throw Error();if(confirm('確定覆蓋這台裝置上的學習紀錄？')){db=d;save();render()}}catch(e){alert('備份格式不正確')}};
function render(){if(page==='home')renderHome();if(page==='wrong')renderWrong();if(page==='progress')renderProgress();if(page==='mock')renderMock();if(page==='settings')renderSettings()}
let lastNotice='';function check(){if(active||[0,6].includes(new Date().getDay())||db.skipWeeks[week()])return;const due=nextDue();if(!due)return;const key=today()+'-'+due.i;if(lastNotice===key)return;lastNotice=key;const toast=$('toast');toast.innerHTML='今日術科練習時間到了。<button onclick="startPractice(\'daily\');document.getElementById(\'toast\').style.display=\'none\'">開始做一題</button>';toast.style.display='block';if(document.visibilityState==='visible'&&'Notification'in window&&Notification.permission==='granted')new Notification('乙級術科練習',{body:'今天來練一題吧',icon:'icon-192.png'})}
fetch('questions.json').then(r=>r.json()).then(a=>{Q=a;render();check();setInterval(check,60000);document.addEventListener('visibilitychange',check)}).catch(()=>{$('home').innerHTML='<div class="card">讀取題庫失敗。請使用 HTTPS 網站開啟，或重新連線。</div>'});if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
